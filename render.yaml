# Blueprint per Render (https://render.com/docs/blueprint-spec).
# Su Render: New → Blueprint → collega il repository → Render legge questo file e chiede i valori mancanti.
services:
  - type: web
    name: segnalatori
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8765"
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_DAYS
        value: "30"
      # Configurazione automatica della demo al primo avvio (il disco del piano gratuito non è persistente).
      - key: SEED_DEMO
        value: "1"
      - key: SETUP_ADMIN_NAME
        value: "Amministrazione"
      - key: SETUP_ADMIN_EMAIL
        sync: false   # da inserire nel pannello Render
      - key: SETUP_ADMIN_PASSWORD
        sync: false   # da inserire nel pannello Render (almeno 8 caratteri)
      - key: DEMO_SEGNALATORE_PASSWORD
        sync: false   # password del broker demo giorgio.parodi@example.it (almeno 8 caratteri)
